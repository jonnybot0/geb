plugins {
    id "groovy"
}

ext {
    // The drivers we want to use
    drivers = ["firefox", "chrome", "chromeHeadless"]

    gebVersion = '8.0.1'
}

repositories {
    mavenCentral()
    maven {
        url 'https://repository.apache.org/content/repositories/releases/'
    }
}

dependencies {
    implementation platform(libs.junit.bom)
    testImplementation libs.groovy.lang

    // If using Spock, need to depend on geb-spock
    testImplementation "org.apache.groovy.geb:geb-spock:$gebVersion"

    // If using JUnit 5, need to depend on geb-junit5
    testImplementation "org.apache.groovy.geb:geb-junit5:$gebVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Selenium Grid provides webdrivers
    testImplementation libs.selenium.grid

    testRuntimeOnly libs.junit.platform.launcher
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

drivers.each { driver ->
    tasks.register("${driver}Test", Test) {
        group JavaBasePlugin.VERIFICATION_GROUP

        outputs.upToDateWhen { false }  // Always run tests

        useJUnitPlatform()

        systemProperty "geb.build.reportsDir", reporting.file("geb/$name")
        systemProperty "geb.env", driver
    }
}

test {
    dependsOn drivers.collect { tasks["${it}Test"] }
}

tasks.withType(Test) {
    maxHeapSize = "1g"
    jvmArgs '-XX:MaxMetaspaceSize=128m'
    testLogging {
        exceptionFormat = 'full'
    }
    useJUnitPlatform()
}

tasks.withType(GroovyCompile) {
    groovyOptions.forkOptions.memoryMaximumSize = '256m'
}
